<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" data-i18n="meta.description" content="NexHub 源仓库：内置源与社区源一览，支持影视/动漫、漫画、小说等分类，可一键导入。" />
  <title data-i18n="pageTitle.sources">源仓库 · NexHub</title>
  <link rel="icon" href="./assets/app-icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./assets/css/style.css" />
</head>
<body data-page="sources">
  <header class="site-header" id="siteHeader"></header>

  <main>
    <section class="section section-soft">
      <div class="container">
        <div class="section-head">
          <h2 data-i18n="sources.title">源仓库</h2>
          <p data-i18n="sources.subtitle">内置源与社区源一览。点击「导入」获取源文件，在 App 内「导入源」即可使用；你也完全可以编写自己的源。</p>
        </div>
        <div class="filter-row" id="sourceFilter"></div>
        <div class="grid grid-3" id="sourceGrid"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="siteFooter"></footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="./assets/js/i18n.js"></script>
  <script src="./assets/js/sources.js"></script>
  <script src="./assets/js/app.js"></script>
</body>
</html>
